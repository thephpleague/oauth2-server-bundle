name: "unit tests"

on:
    pull_request: ~
    push: ~
    schedule:
        # Do not make it the first of the month and/or midnight since it is a very busy time
        - cron: "15 10 5 * *" # Runs at 10:15, on day 5 of the month

jobs:
    tests:
        runs-on: "ubuntu-latest"
        continue-on-error: "${{ matrix.can-fail }}"
        strategy:
            fail-fast: false
            matrix:
                php: ["8.2", "8.3", "8.4", "8.5"]
                symfony: ["7.4.*", "8.1.*"]
                dependency-versions: ["highest"]
                composer-stable: ["1"]
                can-fail: [false]
                include:
                    - php: "8.2"
                      symfony: "7.4.*"
                      dependency-versions: "lowest"
                      composer-stable: "1"
                      can-fail: false
                    - php: "latest"
                      symfony: "8.1.*"
                      composer-flags: ''
                      can-fail: true
                exclude:
                    - php: "8.2"
                      symfony: "8.1.*"
                    - php: "8.3"
                      symfony: "8.1.*"

        name: "PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }} - Composer ${{ matrix.dependency-versions }}"

        steps:
            - name: "checkout"
              uses: "actions/checkout@v6"

            - name: "setup php"
              uses: "shivammathur/setup-php@v2"
              with:
                php-version: "${{ matrix.php }}"
                tools: "composer, flex"

            - name: "enable Symfony Flex plugin"
              run: "composer global config --no-interaction allow-plugins.symfony/flex true"

            - name: "install composer dependencies"
              uses: "ramsey/composer-install@v4"
              env:
                SYMFONY_REQUIRE: "${{ matrix.symfony }}"
                COMPOSER_PREFER_STABLE: "${{ matrix.composer-stable }}"
              with:
                dependency-versions: "${{ matrix.dependency-versions }}"

            - name: "run unit tests"
              run: "vendor/bin/simple-phpunit --colors=always"


    # This is a "trick", a meta task which does not change, and we can use in
    # the protected branch rules as opposed to the individual tests which
    # may change regularly.
    validate-tests:
        name: tests status
        runs-on: ubuntu-latest
        needs: [ tests ]
        if: always()
        steps:
            - name: Successful run
              if: ${{ !(contains(needs.*.result, 'failure')) }}
              run: exit 0

            - name: Failing run
              if: ${{ contains(needs.*.result, 'failure') }}
              run: exit 1
